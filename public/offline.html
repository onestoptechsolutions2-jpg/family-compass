<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Family Compass</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f6ecdd; color: #3b2a1c; text-align: center; padding: 24px;
  }
  .card { max-width: 360px; }
  .icon { font-size: 40px; }
  h1 { font-size: 20px; margin: 12px 0 8px; }
  p { font-size: 14px; line-height: 1.5; color: #6b5a4a; margin: 0 0 20px; }
  button {
    font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 10px;
    border: none; background: #a9773f; color: white; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🧭</div>
    <h1>No signal right now</h1>
    <p>
      You're offline. Pages you've already opened — a profile, a memorial — should still work.
      Anything new, or adding and editing details, needs a connection.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
