# Family Compass — full stack for Coolify (and local `docker compose up`).
#
# Nothing environment-specific is baked in here. Every value comes from the
# deployment environment:
#   * On Coolify: set these in the resource's Environment Variables, and attach
#     your domain to the `app` service in the UI. `APP_PORT` is the host port
#     the app is published on (e.g. 9090); the container always listens on
#     $PORT (default 3000) internally.
#   * Locally: put them in a `.env` file next to this compose file.
#
# The ONLY value you must set is POSTGRES_PASSWORD. Everything else is derived
# at boot (src/lib/env.ts + docker-entrypoint.sh) when unset:
#   DATABASE_URL  <- the bundled postgres service + POSTGRES_PASSWORD
#   APP_URL / AUTH_URL <- COOLIFY_URL / COOLIFY_FQDN injected by the platform
#   AUTH_SECRET   <- stable hash of POSTGRES_PASSWORD (set an explicit one for prod)
# Set any of them explicitly to override the derived value.
# Optional: POSTGRES_USER, POSTGRES_DB, APP_PORT, PORT, GOOGLE_CLIENT_ID/SECRET,
#   EMAIL_SERVER, EMAIL_FROM, ADMIN_EMAILS, RUN_SEED_ON_MIGRATE

x-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familycompass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-familycompass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familycompass} -d ${POSTGRES_DB:-familycompass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: *app-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Only POSTGRES_PASSWORD must be set; the rest derive from it + the
      # platform URL in src/lib/env.ts / docker-entrypoint.sh when left blank.
      POSTGRES_USER: ${POSTGRES_USER:-familycompass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-familycompass}
      COOLIFY_URL: ${COOLIFY_URL:-}
      COOLIFY_FQDN: ${COOLIFY_FQDN:-}
      DATABASE_URL: ${DATABASE_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_URL: ${AUTH_URL:-}
      APP_URL: ${APP_URL:-}
      AUTH_TRUST_HOST: "true"
      PORT: ${PORT:-3000}
      RUN_MIGRATIONS: "true"
      SKIP_SEED: ${SKIP_SEED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_TRANSACTION_TYPE: ${MPESA_TRANSACTION_TYPE:-CustomerBuyGoodsOnline}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      OPEN_SIGNUP: ${OPEN_SIGNUP:-false}
      SELF_START: ${SELF_START:-true}
      CHAMA_ENABLED: ${CHAMA_ENABLED:-true}
      SYSTEM_DB_ALERT_GB: ${SYSTEM_DB_ALERT_GB:-5}
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      ALLOWED_SIGNUP_EMAILS: ${ALLOWED_SIGNUP_EMAILS:-}
      ALLOWED_SIGNUP_DOMAINS: ${ALLOWED_SIGNUP_DOMAINS:-}
    volumes:
      # Named volume by default so scheduled backups survive a redeploy. Bind-
      # mount a host path instead (e.g. `./backups:/app/backups`) to move the
      # copy location off the Docker host's own disk.
      - backups:/app/backups
    expose:
      - "${PORT:-3000}"
    ports:
      - "${APP_PORT:-3000}:${PORT:-3000}"
    healthcheck:
      # node is always present; bookworm-slim ships no curl/wget. No `$` in
      # this string — Compose would try to interpolate it. `process.env.PORT`
      # is read by node at runtime inside the container.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(function(r){process.exit(r.ok?0:1)}).catch(function(){process.exit(1)})"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  worker:
    build: *app-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    command: ["npm", "run", "worker"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familycompass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-familycompass}
      COOLIFY_URL: ${COOLIFY_URL:-}
      COOLIFY_FQDN: ${COOLIFY_FQDN:-}
      DATABASE_URL: ${DATABASE_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_URL: ${AUTH_URL:-}
      APP_URL: ${APP_URL:-}
      RUN_MIGRATIONS: "false"
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    volumes:
      # Same volume as `app` — the scheduled backup job runs here.
      - backups:/app/backups

volumes:
  pgdata:
  backups:
