# Family Compass — full stack for Coolify (and local `docker compose up`).
#
# On Coolify: create a new "Docker Compose" resource pointing at this repo.
# Set the environment variables below in the Coolify UI (they are read from the
# deployment env, with local-dev fallbacks here). Attach your domain to the
# `app` service (port 3000).

x-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familycompass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familycompass}
      POSTGRES_DB: ${POSTGRES_DB:-familycompass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familycompass} -d ${POSTGRES_DB:-familycompass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: *app-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://familycompass:familycompass@postgres:5432/familycompass?schema=public}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (openssl rand -base64 33)}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      RUN_MIGRATIONS: "true"
      RUN_SEED_ON_MIGRATE: ${RUN_SEED_ON_MIGRATE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-Family Compass <no-reply@localhost>}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    expose:
      - "3000"
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      # node is always present; bookworm-slim has no curl/wget.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  worker:
    build: *app-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://familycompass:familycompass@postgres:5432/familycompass?schema=public}
      APP_URL: ${APP_URL:-http://localhost:3000}
      RUN_MIGRATIONS: "false"
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-Family Compass <no-reply@localhost>}

volumes:
  pgdata:
