# Family Compass — full stack for Coolify (and local `docker compose up`).
#
# Nothing environment-specific is baked in here. Every value comes from the
# deployment environment:
#   * On Coolify: set these in the resource's Environment Variables, and attach
#     your domain to the `app` service in the UI. `APP_PORT` is the host port
#     the app is published on (e.g. 9090); the container always listens on
#     $PORT (default 3000) internally.
#   * Locally: put them in a `.env` file next to this compose file.
#
# Required (compose refuses to start without them):
#   POSTGRES_PASSWORD, DATABASE_URL, AUTH_SECRET, AUTH_URL, APP_URL
# Optional:
#   POSTGRES_USER, POSTGRES_DB, APP_PORT, PORT, GOOGLE_CLIENT_ID/SECRET,
#   EMAIL_SERVER, EMAIL_FROM, ADMIN_EMAILS, RUN_SEED_ON_MIGRATE

x-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familycompass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-familycompass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familycompass} -d ${POSTGRES_DB:-familycompass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: *app-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (openssl rand -base64 33)}
      AUTH_URL: ${AUTH_URL:?set AUTH_URL to your public origin, e.g. https://host}
      APP_URL: ${APP_URL:?set APP_URL to your public origin, e.g. https://host}
      AUTH_TRUST_HOST: "true"
      PORT: ${PORT:-3000}
      RUN_MIGRATIONS: "true"
      RUN_SEED_ON_MIGRATE: ${RUN_SEED_ON_MIGRATE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    expose:
      - "${PORT:-3000}"
    ports:
      - "${APP_PORT:-3000}:${PORT:-3000}"
    healthcheck:
      # node is always present; bookworm-slim ships no curl/wget. No `$` in
      # this string — Compose would try to interpolate it. `process.env.PORT`
      # is read by node at runtime inside the container.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then(function(r){process.exit(r.ok?0:1)}).catch(function(){process.exit(1)})"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  worker:
    build: *app-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      APP_URL: ${APP_URL:?set APP_URL}
      RUN_MIGRATIONS: "false"
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}

volumes:
  pgdata:
